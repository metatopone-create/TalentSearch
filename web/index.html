<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talent Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="Main">
    <a class="brand" href="#/">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="3" fill="currentColor"></rect><path d="M5.5 7h9M5.5 10h9M5.5 13h5" stroke="var(--surface)" stroke-width="1.5" stroke-linecap="round"></path><circle cx="14.5" cy="13" r="1.8" fill="var(--trace-accent)"></circle></svg>
      <span>Talent Search</span>
    </a>
    <a class="nav-a" data-nav="search" href="#/"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>Search</a>
    <a class="nav-a" data-nav="history" href="#/history"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.5V8l2.5 1.5"></path></svg>History</a>
    <a class="nav-a" data-nav="cost" href="#/cost"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3.5" width="12" height="9" rx="1"></rect><path d="M2 6.5h12M5 10h2"></path></svg>Cost report</a>
    <div class="nav-foot">
      <span class="muted xs">Spent this month</span>
      <span class="mono nav-spent" id="month-spent">—</span>
      <span class="muted xs" id="month-searches"></span>
      <span class="demo-flag xs" id="demo-flag" hidden>Demo data · no API calls</span>
    </div>
  </nav>
  <div class="view" id="view"></div>
</div>
<div id="drawer-root"></div>
<script src="/static/app.js"></script>
</body>
</html>
