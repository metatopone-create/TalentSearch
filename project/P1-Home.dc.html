<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#f3f4f2;color:#15181c;font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:20px}
a{color:#2140c4;text-decoration:none}a:hover{color:#1a33a0;text-decoration:underline}
button{font-family:inherit;cursor:pointer}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;box-sizing:border-box;border-radius:4px;border:1px solid #848b88;background:#fff;color:#15181c;font-size:13px;font-weight:500;line-height:18px;white-space:nowrap}
.btn:hover{background:#eceeeb}
.btn-p{background:#2140c4;border-color:#2140c4;color:#fff}.btn-p:hover{background:#1a33a0}
.nav-a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:4px;color:#15181c;font-size:14px}
.nav-a:hover{background:#eceeeb;color:#15181c;text-decoration:none}
.nav-on{background:#e5e9fb;color:#2140c4;font-weight:500}
.ex{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid #dfe2de;background:transparent;color:#15181c;font-size:14px;line-height:20px}
.ex:hover{background:#ffffff;color:#2140c4}
textarea:focus-visible,:focus-visible{outline:2px solid #2140c4;outline-offset:2px}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; background: #f3f4f2;">
  <nav aria-label="Main" style="flex: 1 1 208px; max-width: 208px; box-sizing: border-box; background: #ffffff; border-right: 1px solid #dfe2de; display: flex; flex-direction: column; gap: 4px; padding: 16px 12px;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 4px 10px 18px;"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="1" y="1" width="18" height="18" rx="3" fill="#15181c"></rect><path d="M5.5 7h9M5.5 10h9M5.5 13h5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"></path><circle cx="14.5" cy="13" r="1.8" fill="#a3b4ff"></circle></svg><span style="font-weight: 600;">Talent Search</span></div>
    <a class="nav-a nav-on" href="P1-Home.dc.html" aria-current="page"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>Search</a>
    <a class="nav-a" href="#"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"></circle><path d="M8 4.5V8l2.5 1.5"></path></svg>History</a>
    <a class="nav-a" href="P6-Cost.dc.html"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3.5" width="12" height="9" rx="1"></rect><path d="M2 6.5h12M5 10h2"></path></svg>Cost report</a>
    <div style="margin-top: auto; border-top: 1px solid #dfe2de; padding: 14px 10px 4px; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 12px; line-height: 16px; color: #555d66;">Spent this month</span><span class="mono" style="font-size: 16px; line-height: 22px; font-weight: 500;">$18.42</span><span style="font-size: 12px; line-height: 16px; color: #555d66;">31 searches</span></div>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 120px 24px 48px; display: flex; justify-content: center;">
    <div style="width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 48px;">
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <h1 style="margin: 0; font-size: 30px; line-height: 38px; font-weight: 600; letter-spacing: -0.01em;">Who are you looking for?</h1>
        <form style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #848b88; border-radius: 6px;">
          <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search request</label>
          <textarea id="q" rows="3" value="{{q}}" onChange="{{onQ}}" placeholder="Describe who you're looking for — role, skills, location, experience" style="border: 0; border-radius: 6px 6px 0 0; resize: none; padding: 16px 18px 8px; font-family: inherit; font-size: 17px; line-height: 26px; color: #15181c; background: transparent; outline-offset: -2px;"></textarea>
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px 12px 18px;">
            <span style="font-size: 13px; line-height: 18px; color: #555d66;">You'll review the plan and cost before anything is spent.</span>
            <button type="button" class="btn btn-p" style="height: 36px; padding: 0 16px;"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>Plan search</button>
          </div>
        </form>
      </div>

      <section style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 600;">Try an example</h2>
        <div style="display: flex; flex-direction: column; border-top: 1px solid #dfe2de;">
          <sc-for list="{{examples}}" as="e" hint-placeholder-count="5">
            <button type="button" class="ex" onClick="{{e.pick}}"><svg class="ic" viewBox="0 0 16 16" style="color: #555d66;" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h6"></path></svg>{{e.text}}</button>
          </sc-for>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: '' }; }
  renderVals() {
    const list = [
      'LLM inference optimization engineers in the US',
      'PhD researchers in computer vision, California',
      'Full-stack engineers who contribute to open-source AI agent frameworks',
      'Engineers experienced with on-device model deployment on iOS (Core ML)',
      'Applied scientists in speech recognition with production experience, remote US'
    ];
    return {
      q: this.state.q,
      onQ: (ev) => this.setState({ q: ev.target.value }),
      examples: list.map((text) => ({ text, pick: () => this.setState({ q: text }) }))
    };
  }
}
</script>
</body>
</html>
